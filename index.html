<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroFlex Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/opendyslexic" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nf: {
                bg: '#F5F6F0',
                surface: '#FFFFFF',
                surface2: '#EEF0E7',
                ink: '#20261E',
                muted: '#6C7365',
                border: '#DFE3D6',
                teal: '#2B6E6B',
                'teal-soft': '#DCEBE9',
                gold: '#E4A036',
                'gold-soft': '#FBEBCD',
                coral: '#E2694F',
                'coral-soft': '#FBE4DE',
                hc: {
                  bg: '#12140F',
                  surface: '#1C2018',
                  surface2: '#262B21',
                  ink: '#F6F8F1',
                  muted: '#B7BDA9',
                  border: '#3A4133',
                  teal: '#6FD6CE',
                  'teal-soft': '#1E3A38',
                  gold: '#FFC96B',
                  'gold-soft': '#3A2E14',
                  coral: '#FF9376',
                  'coral-soft': '#3A2018',
                },
              },
            },
            fontFamily: {
              display: ['"Space Grotesk"', 'sans-serif'],
              body: ['"Atkinson Hyperlegible"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              dyslexic: ['"Open-Dyslexic"', '"Atkinson Hyperlegible"', 'sans-serif'],
            },
            borderRadius: {
              nf: '14px',
              'nf-sm': '8px',
            },
            boxShadow: {
              nf: '0 1px 2px rgba(32,38,30,0.04), 0 8px 24px -12px rgba(32,38,30,0.12)',
              'nf-hc': '0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5)',
            },
          },
        },
      };
    </script>
    <!-- PDF.js for PDF parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- JSZip for PPTX parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body class="bg-nf-bg text-nf-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
